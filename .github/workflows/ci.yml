name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI 不下载 100MB 模型：hash embedder + 词面重排，行为与本地一致（报告里会标注用的哪个 embedder）
      DOCUMIND_EMBED_BACKEND: hash
      DOCUMIND_RERANK_BACKEND: lexical
      DOCUMIND_DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - name: 评测门禁（阈值不达标就让 PR 红）
        run: uv run python scripts/ci_eval_gate.py